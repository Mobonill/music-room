name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Retrieve the code
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Compilation
        run: npm run build